name: Build and release

# Runs whenever you push a tag that starts with "v", e.g. v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release and upload files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: OMSkan-Windows.exe
          - os: macos-latest
            asset: OMSkan-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name OMSkan --hidden-import PIL.Image --collect-all pypdfium2 --collect-all zxingcpp content/app.py
          Move-Item dist/OMSkan.exe dist/OMSkan-Windows.exe

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name OMSkan --hidden-import PIL.Image --collect-all pypdfium2 --collect-all zxingcpp content/app.py
          ditto -c -k --sequesterRsrc --keepParent dist/OMSkan.app dist/OMSkan-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create release and upload files
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true